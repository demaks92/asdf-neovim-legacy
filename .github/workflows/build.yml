name: Build

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    paths-ignore:
      - "**.md"

jobs:
  plugin_test:
    name: ASDF plugin test
    strategy:
      matrix:
        os: [ubuntu-latest]
        image: [node:20-buster]
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup ASDF
        uses: asdf-vm/actions/setup@v4

      - name: Test ASDF plugin
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: nvim --version
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
